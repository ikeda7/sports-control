name: Deploy Web → Vercel

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# Uma execução por ref. Um push novo cancela o deploy anterior em andamento.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Rede de segurança: em 2026-07-24 um `npx vercel@latest` travou e o job
    # só morreu no limite padrão de 6h. Nunca mais.
    timeout-minutes: 25

    env:
      # A CLI da Vercel lê estes dois nomes exatos e se vincula ao projeto
      # sem precisar de `vercel link` interativo.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Compile drift worker
        run: dart compile js -O2 -o web/drift_worker.dart.js lib/database/drift_worker.dart

      # Nota: CanvasKit continua vindo de www.gstatic.com, e está tudo bem —
      # o gstatic responde com `cross-origin-resource-policy: cross-origin`,
      # então satisfaz o COEP: require-corp do vercel.json (verificado).
      # Servir do /canvaskit/ local NÃO se faz por --dart-define nesta versão
      # do Flutter; exige sobrescrever o web/flutter_bootstrap.js. Ver issue #24.
      - name: Build web
        run: flutter build web --release

      - name: Verify build output
        run: |
          set -euo pipefail
          for f in index.html main.dart.js flutter_bootstrap.js vercel.json \
                   sqlite3.wasm drift_worker.dart.js canvaskit/canvaskit.wasm; do
            if [ ! -f "build/web/$f" ]; then
              echo "::error::Artefato ausente em build/web: $f"
              exit 1
            fi
          done
          echo "Artefatos OK ($(du -sh build/web | cut -f1))"

      # Instalamos a CLI globalmente em vez de usar `npx vercel@...`:
      # o npx pode parar para pedir confirmação de instalação e travar o job.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            PROD_FLAG="--prod"
            echo "Ambiente: PRODUÇÃO"
          else
            PROD_FLAG=""
            echo "Ambiente: PREVIEW (${{ github.ref_name }})"
          fi

          # --archive=tgz envia um único tarball; o build web tem centenas de
          # arquivos e o upload individual é lento e frágil.
          URL=$(vercel deploy ./build/web \
            --token="$VERCEL_TOKEN" \
            --archive=tgz \
            --yes \
            $PROD_FLAG)

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deploy publicado em: $URL"

      - name: Smoke test deployment
        # Só em produção. URLs de preview ficam atrás do Deployment Protection
        # da Vercel, que responde 302 para uma tela de login SSO — não dá para
        # validar sem um bypass token, e o 302 não significa deploy quebrado.
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          TARGET="https://sportscontrol.vercel.app"
          echo "Verificando $TARGET"
          for path in / /main.dart.js /flutter_bootstrap.js /sqlite3.wasm; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 \
                     --retry-all-errors "$TARGET$path")
            echo "  $path -> $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::$TARGET$path respondeu $CODE (esperado 200)"
              exit 1
            fi
          done
          echo "Smoke test OK"

      - name: Preview pronto
        if: github.ref != 'refs/heads/master'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Preview publicado: $URL"
          echo "Se pedir login, é o Deployment Protection da Vercel — entre com"
          echo "a conta dona do projeto, ou desative em Settings > Deployment"
          echo "Protection para o time conseguir abrir o preview sem conta."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy Web"
            echo ""
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Ambiente | ${{ github.ref == 'refs/heads/master' && 'produção' || 'preview' }} |"
            echo "| URL | ${{ steps.deploy.outputs.url || 'n/d' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
